name: Continuous Integration Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Testing Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov

      # 1. Run Unit Tests first (fail fast — no DB/network involved).
      #    If this step fails, subsequent test steps are skipped
      #    automatically since they are not conditioned on always().
      - name: Run Unit Tests
        run: |
          pytest tests/test_unit.py -v --junitxml=unit-results-${{ matrix.python-version }}.xml

      # 2. Run Integration Tests second (only reached if unit tests passed).
      - name: Run Integration Tests
        run: |
          pytest tests/test_integration.py -v --junitxml=integration-results-${{ matrix.python-version }}.xml

      # 3. Enforce >=90% coverage across the full suite.
      - name: Enforce Coverage Threshold
        run: |
          pytest tests/ \
            --cov=notification_engine \
            --cov-report=term-missing \
            --cov-report=xml:coverage-${{ matrix.python-version }}.xml \
            --cov-report=html:htmlcov-${{ matrix.python-version }} \
            --cov-fail-under=90 \
            --junitxml=full-results-${{ matrix.python-version }}.xml

      # Always upload whatever results were produced, even on failure,
      # so a failed run's test report/coverage can still be inspected.
      - name: Upload Test Result Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-py${{ matrix.python-version }}
          path: |
            unit-results-${{ matrix.python-version }}.xml
            integration-results-${{ matrix.python-version }}.xml
            full-results-${{ matrix.python-version }}.xml
          retention-days: 14
          if-no-files-found: warn

      - name: Upload Coverage Report Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-py${{ matrix.python-version }}
          path: |
            coverage-${{ matrix.python-version }}.xml
            htmlcov-${{ matrix.python-version }}/
          retention-days: 14
          if-no-files-found: warn